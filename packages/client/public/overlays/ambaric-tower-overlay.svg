<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Ambaric Tower: tall tapered iron shaft on a stepped stone base -->
  <path d="M40 98H88" stroke="#7D7468" stroke-width="8" stroke-linecap="round"/>
  <path d="M46 90H82" stroke="#8A8078" stroke-width="6" stroke-linecap="round"/>
  <path d="M59 90V32H69V90H59Z" fill="#2A241E"/>

  <!-- Two brass ambaric coils spiralling up its length -->
  <path d="M58 82L70 76" stroke="#B3833A" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 70L70 64" stroke="#B3833A" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 58L70 52" stroke="#B3833A" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 46L70 40" stroke="#B3833A" stroke-width="3" stroke-linecap="round"/>

  <!-- Wide brass ambaric crown (a shallow dish) -->
  <path d="M50 32L64 24L78 32L64 40L50 32Z" fill="#B3833A"/>

  <!-- Signature: three short relay arms near the crown, each tipped with a small amber ember -->
  <path d="M50 34H36" stroke="#B3833A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="34" cy="34" r="2" fill="#FFB347"/>
  <path d="M78 34H92" stroke="#B3833A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="94" cy="34" r="2" fill="#FFB347"/>
  <path d="M64 40V48" stroke="#B3833A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="50" r="2" fill="#FFB347"/>

  <!-- Amber octahedron crystal floating above the crown, with warm glow -->
  <circle cx="64" cy="16" r="8" fill="#FFB347" opacity="0.3"/>
  <path d="M64 6L70 15L64 24L58 15L64 6Z" fill="#FFB347"/>
  <path d="M64 24L70 15H58L64 24Z" fill="#D68A18"/>

</svg>
