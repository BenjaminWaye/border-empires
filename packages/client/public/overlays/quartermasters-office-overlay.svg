  <path d="M34 74L46 68H58L46 74H34Z" fill="#3E4248"/>

  <!-- Two gable chimneys -->
  <path d="M44 66V52H54V66H44Z" fill="#6E6459"/>
  <path d="M74 66V52H84V66H74Z" fill="#6E6459"/>
