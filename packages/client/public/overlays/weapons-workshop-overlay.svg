<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Weapons Workshop: a small titanium-alloy forging bay — low platform,
       an alloy press (base + tapered forming horn) lit by a glowing plasma
       core, and a rack of charged cyan energy blades off to the side.
       Deliberately smaller/plainer than Foundry (no furnace/chimneys)
       since this is a cheap, uncapped early War-branch building meant to
       be built many times over. -->

  <!-- Platform -->
  <path d="M18 96L38 84H100L80 96H18Z" fill="#2A2E33"/>
  <path d="M38 84V74H100V84H38Z" fill="#5C6670"/>

  <!-- Alloy press: base block + tapered forming horn pointing right -->
  <path d="M52 76V66H68V76H52Z" fill="#8A97A4"/>
  <path d="M68 70L82 68L80 74L68 76V70Z" fill="#8A97A4"/>
  <path d="M52 66H68L64 62H56L52 66Z" fill="#B7C2CC"/>

  <!-- Glowing plasma core in front of the press -->
  <path d="M56 84L60 78L64 84L68 80L72 86H56Z" fill="#29C8FF"/>
  <path d="M60 84L63 80L66 84H60Z" fill="#BDF3FF"/>

  <!-- Weapon rack: two posts and three charged energy blades -->
  <path d="M26 84V68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 84V68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 68L44 68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 68L20 44L24 42L28 68H25Z" fill="#6FE3FF"/>
  <path d="M31 68L31 40L36 40L34 68H31Z" fill="#6FE3FF"/>
  <path d="M39 68L44 44L48 46L42 68H39Z" fill="#6FE3FF"/>

</svg>
