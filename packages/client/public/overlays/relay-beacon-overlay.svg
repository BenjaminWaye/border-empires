<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#15161a">
    <!-- ground contact -->
    <ellipse cx="64" cy="119" rx="36" ry="5" fill="#14161b" fill-opacity="0.3" stroke="none"/>

    <!-- anchor feet -->
    <path d="M29 104 H36 V107 H29 Z M92 104 H99 V107 H92 Z" fill="#1a1b20"/>

    <!-- aether-gas tank peeking out behind the base, right -->
    <path d="M92 84 H101 V106 H92 Z" fill="#2b2d33"/>
    <path d="M90 90 H103 V93 H90 Z M90 100 H103 V103 H90 Z" fill="#8a6b3c"/>
    <path d="M91.5 82.5 H101.5 V85 H91.5 Z M95.5 79.5 H98.5 V83 H95.5 Z" fill="#1a1b20"/>
    <path d="M93.5 77.5 H100.5 V79.5 H93.5 Z" fill="#8a6b3c"/>

    <!-- control housing base -->
    <path d="M42 99 H86 L82 104 H46 Z" fill="#3a3d45"/>
    <path d="M46 104 H82 L79 110 H51 Z" fill="#2b2d33"/>
    <path d="M57 105.5 H71 V109 H57 Z" fill="#8a6b3c"/>

    <!-- slender lattice column -->
    <path d="M59 62 H69 V103 H59 Z" fill="#22242a"/>
    <path d="M57.5 78 H70.5 V82 H57.5 Z" fill="#8a6b3c"/>

    <!-- converging lattice legs -->
    <path d="M42 62 L32 104 M86 62 L96 104" stroke="#26282e" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M54 62 L51 104 M74 62 L77 104" stroke="#2b2d33" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- cross braces -->
    <path d="M44 66 L84 88 M84 66 L44 88" stroke="#1a1b20" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M41 91 L87 102 M87 91 L41 102" stroke="#1a1b20" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- brass feed pipes up the tower -->
    <path d="M54 101 V63 M74 101 V63" stroke="#8a6b3c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="54" cy="74" r="2.4" fill="#b08d55"/>
    <circle cx="74" cy="84" r="2.4" fill="#b08d55"/>

    <!-- observation deck -->
    <path d="M44 50 H84 L80 55 H48 Z" fill="#3a3d45"/>
    <path d="M48 55 H80 L76 60 H52 Z" fill="#2b2d33"/>
    <path d="M52 60 H76 L73 64 H55 Z" fill="#26282e"/>
    <path d="M45 46 H83 M48 46 V50 M56 46 V50 M64 46 V50 M72 46 V50 M80 46 V50" stroke="#1a1b20" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- enclosed optics box -->
    <path d="M57 41 H71 V50 H57 Z" fill="#1a1b20"/>
    <path d="M57 41 H71 V43 H57 Z" fill="#8a6b3c"/>
    <path d="M60 44.5 H68 V47.5 H60 Z" fill="#24323d"/>

    <!-- geared periscopes -->
    <path d="M51 46 L38 57 M77 46 L90 57" stroke="#8a6b3c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="37" cy="58" r="3" fill="#24323d"/>
    <circle cx="91" cy="58" r="3" fill="#24323d"/>
    <circle cx="51" cy="46" r="3.4" fill="#4a443c"/>
    <circle cx="77" cy="46" r="3.4" fill="#4a443c"/>

    <!-- spindle + heliograph mirror array -->
    <path d="M62.5 35 H65.5 V45 H62.5 Z" fill="#b08d55"/>
    <circle cx="64" cy="28" r="7" fill="#b08d55"/>
    <path d="M53 17 L61 13 L66 21 L58 25 Z M72 13 L79 18 L75 26 L68 22 Z M47 28 L52 24 L59 26 L54 30 Z M80 25 L75 29 L68 27 L73 23 Z M56 37 L53 31 L60 30 L62 35 Z M73 31 L77 37 L70 39 L67 33 Z" fill="#8a6b3c" stroke-width="1.2"/>

    <!-- pressure-fed amber signal lamps -->
    <path d="M45 52 V55 M83 52 V55 M64 60 V61.5" stroke="#2b2d33" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="57.5" r="3" fill="#3a3d45"/>
    <circle cx="83" cy="57.5" r="3" fill="#3a3d45"/>
    <circle cx="64" cy="63" r="3" fill="#3a3d45"/>
    <circle cx="45" cy="57.5" r="2" fill="#ff9d3d"/>
    <circle cx="83" cy="57.5" r="2" fill="#ff9d3d"/>
    <circle cx="64" cy="63" r="2" fill="#ff9d3d"/>
    <circle cx="45" cy="57.5" r="0.8" fill="#ffd9a0" stroke="none"/>
    <circle cx="83" cy="57.5" r="0.8" fill="#ffd9a0" stroke="none"/>
    <circle cx="64" cy="63" r="0.8" fill="#ffd9a0" stroke="none"/>
