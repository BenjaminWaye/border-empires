<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1a1b20">
    <!-- ground contact -->
    <ellipse cx="64" cy="106" rx="46" ry="5" fill="#14161b" fill-opacity="0.3" stroke="none"/>

    <!-- hair-thin luminous aether line between the pylons -->
    <path d="M40 52 L88 52" stroke="#9fe6ff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="64" cy="52" r="3" fill="#bdf3ff" stroke="none"/>

    <!-- left pylon: foot + slender post -->
    <path d="M26 96 H40 V102 H26 Z" fill="#2b2d33"/>
    <path d="M31 54 H35 V97 H31 Z" fill="#26282e"/>

    <!-- left pylon: small geometric emitter + one tiny ring + glow -->
    <path d="M33 32 L42 40 L33 48 L24 40 Z" fill="#3a3d45"/>
    <ellipse cx="33" cy="40" rx="11" ry="4.5" fill="none" stroke="#8a6b3c" stroke-width="2.2"/>
    <circle cx="33" cy="40" r="4" fill="#9fe6ff"/>
    <circle cx="33" cy="40" r="1.6" fill="#bdf3ff" stroke="none"/>

    <!-- right pylon: foot + slender post -->
    <path d="M88 96 H102 V102 H88 Z" fill="#2b2d33"/>
    <path d="M93 54 H97 V97 H93 Z" fill="#26282e"/>

    <!-- right pylon: small geometric emitter + one tiny ring + glow -->
    <path d="M95 32 L104 40 L95 48 L86 40 Z" fill="#3a3d45"/>
    <ellipse cx="95" cy="40" rx="11" ry="4.5" fill="none" stroke="#8a6b3c" stroke-width="2.2"/>
    <circle cx="95" cy="40" r="4" fill="#9fe6ff"/>
    <circle cx="95" cy="40" r="1.6" fill="#bdf3ff" stroke="none"/>
  </g>
</svg>
