<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Ancillary Factory: compact open-sided workshop with a tall hopper-tower
       (the lift where laborers come out). Built in quantity, deliberately
       smaller and plainer than the rare Assembly Works. -->

  <!-- Workshop floor, walls, roof deck -->
  <path d="M20 102L38 90H90L72 102H20Z" fill="#3E4248"/>
  <path d="M38 90V78H90V90H38Z" fill="#5A5E62"/>
  <path d="M90 90L108 78V66L90 78V90Z" fill="#2A241E"/>
  <path d="M38 78L60 64H108L90 78H38Z" fill="#2A241E"/>

  <!-- Short drive-shaft with three small gear-stages under the eaves -->
  <path d="M36 82H62" stroke="#C8CCD2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 82V78H44V82H40Z" fill="#B3833A"/>
  <path d="M48 82V78H52V82H48Z" fill="#B3833A"/>
  <path d="M56 82V78H60V82H56Z" fill="#B3833A"/>

  <!-- Tall hopper-tower: stacked lift rising above the roofline -->
  <path d="M84 78V60H98V78H84Z" fill="#2A241E"/>
  <path d="M86 60V46H96V46V60H86Z" fill="#3E4248"/>
  <path d="M88 46V36H94V46H88Z" fill="#2A241E"/>

  <!-- Flared chute at the tower base where laborers come out -->
  <path d="M86 78H96L94 86H88L86 78Z" fill="#2A241E"/>

  <!-- Two-figure output line queued at the chute -->
  <rect x="84" y="90" width="4" height="6" fill="#E8E6DF"/>
  <path d="M86 90L88 86L90 90H86Z" fill="#E8E6DF"/>
  <rect x="92" y="91" width="4" height="6" fill="#E8E6DF"/>
  <path d="M94 91L96 87L98 91H94Z" fill="#E8E6DF"/>

  <!-- One amber vent lamp glowing on the tower top -->
  <path d="M91 36V30" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M89 30H93L91 25L89 30Z" fill="#FFB347"/>

</svg>
