<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Fur Weapons Factory: raiding doctrine — same forging-bay silhouette as
       the retired Weapons Workshop, recolored toward warm tanned-hide
       tones, with a slimmer twin-blade rack (fast, light raiding gear)
       instead of the triple-blade cluster, to read as "attack-leaning"
       at a glance. -->

  <!-- Platform -->
  <path d="M18 96L38 84H100L80 96H18Z" fill="#2A2E33"/>
  <path d="M38 84V74H100V84H38Z" fill="#5C6670"/>

  <!-- Tanning press: base block + tapered forming horn pointing right -->
  <path d="M52 76V66H68V76H52Z" fill="#A47C52"/>
  <path d="M68 70L82 68L80 74L68 76V70Z" fill="#A47C52"/>
  <path d="M52 66H68L64 62H56L52 66Z" fill="#D8B78C"/>

  <!-- Glowing forge core, amber instead of plasma-cyan -->
  <path d="M56 84L60 78L64 84L68 80L72 86H56Z" fill="#FFB13D"/>
  <path d="M60 84L63 80L66 84H60Z" fill="#FFE3B0"/>

  <!-- Weapon rack: two posts and two light raiding blades -->
  <path d="M26 84V68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 84V68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 68L44 68" stroke="#3A424A" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 68L24 46L28 44L32 68H28Z" fill="#FFC97A"/>
  <path d="M38 68L42 46L46 48L40 68H38Z" fill="#FFC97A"/>

</svg>
