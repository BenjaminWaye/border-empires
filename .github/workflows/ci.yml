name: CI

# Runs on every PR (whatever the target branch) and on every push to
# develop/main, as the gate that deploy-staging.yml / deploy-prod.yml wait
# on before deploying. See docs/agents/deploys.md for the branch flow.
on:
  pull_request:
  push:
    branches:
      - develop
      - main

# A new push to the same PR supersedes its previous validation. Cancelling the
# obsolete run frees runners for the commit a reviewer can actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # node:sqlite (used by apps/simulation) requires Node 22.5+.
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check file line limits
        run: pnpm check:file-lines

      - name: Check documentation contracts
        run: pnpm check:docs

      # `pnpm -r lint` type-checks every package against its real dependency
      # packages (not path-mapped source), so shared/game-domain/client-protocol/
      # sim-protocol must be built first or downstream packages fail with
      # "Cannot find module '@border-empires/shared'" (see scripts/local-ci.sh,
      # which builds each package before linting/testing it, for the
      # canonical order). Confirmed live: the first CI run on develop failed
      # exactly this way (run 34614665342) before this reordering.
      - name: Build workspace packages
        run: |
          pnpm --filter @border-empires/shared build
          pnpm --filter @border-empires/game-domain build
          pnpm --filter @border-empires/client-protocol build
          pnpm --filter @border-empires/sim-protocol build
          pnpm --filter @border-empires/simulation build
          pnpm --filter @border-empires/realtime-gateway build
          pnpm --filter @border-empires/client build

      - name: Lint
        run: pnpm lint

      - name: Test repository scripts
        run: pnpm test:scripts

  test-other-packages:
    name: Test other packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Simulation and client tests run in dedicated shards below. The other
      # packages retain pnpm's existing concurrent execution behavior.
      - name: Build workspace packages
        run: pnpm build

      - name: Test other packages
        run: pnpm -r --filter '!@border-empires/simulation' --filter '!@border-empires/client' test

  test-client:
    name: Test client (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @border-empires/client... build
      - run: pnpm --filter @border-empires/client test -- --shard ${{ matrix.shard }}/6

  test-simulation:
    name: Test simulation (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @border-empires/simulation... build
      - run: pnpm --filter @border-empires/simulation test -- --shard ${{ matrix.shard }}/8

  test-slow-worldgen:
    name: Test slow worldgen (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @border-empires/simulation... build
      - name: Test slow worldgen shard
        env:
          WORLDGEN_COVERAGE_SHARD: ${{ matrix.shard }}/5
        run: pnpm --filter @border-empires/simulation test:slow

  # Preserve the historical required-check name while making the workflow's
  # success contingent on every independently sharded validation job.
  ci:
    name: Lint, test, build
    if: ${{ always() }}
    needs:
      - static
      - test-other-packages
      - test-client
      - test-simulation
      - test-slow-worldgen
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          NEEDS_RESULT: ${{ toJson(needs) }}
        run: |
          if printf '%s' "$NEEDS_RESULT" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            exit 0
          fi
          printf '%s\n' "$NEEDS_RESULT"
          exit 1
