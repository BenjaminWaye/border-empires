name: Daily activity digest

on:
  schedule:
    # 6:00am Stockholm time. Stockholm is UTC+2 (CEST) in summer / UTC+1 (CET)
    # in winter; GitHub Actions cron is fixed UTC and does not shift with DST,
    # so this fires at 6:00am Stockholm during CEST and 7:00am during CET.
    # Update this cron by hand around the March/October DST changeovers if
    # exact 6:00am local matters.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  post-digest:
    name: Post daily activity digest to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Hits the live production GET /api/activity endpoint (play.borderempires.com)
    # and posts a curated highlights summary to Slack. No repo checkout needed
    # beyond scripts/daily-activity-digest.mjs, no build step — this is a thin
    # HTTP-to-HTTP job, same shape as the nightly-load-harness Slack notify step.
    env:
      ACTIVITY_API_URL: "https://play.borderempires.com/api/activity"
      # Reusing the existing load-harness alert webhook/channel for now —
      # swap to a dedicated ACTIVITY_DIGEST_SLACK_WEBHOOK secret once a
      # channel for this digest is picked.
      SLACK_WEBHOOK_URL: ${{ secrets.LOAD_HARNESS_SLACK_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post digest
        if: env.SLACK_WEBHOOK_URL != ''
        run: node scripts/daily-activity-digest.mjs

      - name: Skip (no webhook configured)
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "LOAD_HARNESS_SLACK_WEBHOOK secret is not set — skipping."
