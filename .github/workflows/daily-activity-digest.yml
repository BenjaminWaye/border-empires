name: Daily activity digest

# No `schedule:` trigger here anymore -- GitHub deprioritizes cron-triggered
# workflow runs under scheduler load, which drifted this digest's actual
# post time later and later (nominally 04:00 UTC, actually landing past
# 08:00 UTC some days; see docs/agents/ discussion). The daily post is now
# driven by an in-process timer on the always-on gateway process itself
# (apps/realtime-gateway/src/daily-activity-digest/daily-activity-digest-poll.ts,
# wired from main.ts / main-merged.ts), which fires at exactly 07:00 Europe/
# Stockholm with no scheduler queue in between. This workflow is kept only
# for manual/ad-hoc re-posts via workflow_dispatch.
on:
  workflow_dispatch: {}

jobs:
  post-digest:
    name: Post daily activity digest to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Hits the live production GET /api/activity endpoint. This lives on the
    # rewrite-stack gateway (border-empires-combined.fly.dev), NOT on
    # play.borderempires.com — that domain serves the Vercel client only and
    # 404s on API routes (every scheduled/manual run before this fix hit that
    # 404: see gh runs 33382653819, 33335819883). Posts a curated highlights
    # summary to Slack. No repo checkout needed beyond
    # scripts/daily-activity-digest.mjs, no build step — this is a thin
    # HTTP-to-HTTP job, same shape as the nightly-load-harness Slack notify step.
    env:
      ACTIVITY_API_URL: "https://border-empires-combined.fly.dev/api/activity"
      # Reusing the existing load-harness alert webhook/channel for now —
      # swap to a dedicated ACTIVITY_DIGEST_SLACK_WEBHOOK secret once a
      # channel for this digest is picked.
      SLACK_WEBHOOK_URL: ${{ secrets.LOAD_HARNESS_SLACK_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post digest
        if: env.SLACK_WEBHOOK_URL != ''
        run: node scripts/daily-activity-digest.mjs

      - name: Skip (no webhook configured)
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "LOAD_HARNESS_SLACK_WEBHOOK secret is not set — skipping."
