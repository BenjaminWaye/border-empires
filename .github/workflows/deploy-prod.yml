name: Deploy production

# Fires on every push to main, after CI is green. Runs the prod-shape gate
# against an SSH clone of the live Hetzner database, then deploys the combined
# sim+gateway and the static client to the Hetzner production server. See
# docs/agents/deploys.md for the full gate rationale and manual fallback.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Needed for the "Force-push main onto production branch" and "Tag release"
# steps: many repos default GITHUB_TOKEN to read-only, which would 403 on
# push.
permissions:
  contents: write
  packages: write

jobs:
  deploy-prod:
    name: Deploy main to production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout main at the CI'd commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace internal packages
        run: |
          pnpm --filter @border-empires/shared \
            --filter @border-empires/client-protocol \
            --filter @border-empires/sim-protocol \
            --filter @border-empires/game-domain \
            build
          pnpm --filter @border-empires/simulation build
          pnpm --filter @border-empires/realtime-gateway build

      # --- Prod-shape gate: prove the candidate against a live-shaped world
      # before touching real production. See docs/agents/deploys.md.
      - name: Clone prod SQLite snapshot
        id: clone
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          pnpm ops:prod-shape:clone-snapshot \
            --ssh "deploy@${PROD_SSH_HOST}" \
            --ssh-opts "-i ${HOME}/.ssh/hetzner_deploy -o StrictHostKeyChecking=yes" \
            | tee /tmp/clone-output.txt
          LOCAL_DB="$(grep -oE 'local_db=.*' /tmp/clone-output.txt | tail -1 | sed 's/^local_db=//')"
          if [ -z "${LOCAL_DB}" ]; then
            echo "::error::could not find local_db= line in clone-snapshot output"
            exit 1
          fi
          echo "local_db=${LOCAL_DB}" >> "$GITHUB_OUTPUT"
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Boot combined stack against the clone
        run: |
          GATEWAY_SQLITE_PATH="${{ steps.clone.outputs.local_db }}" \
          SIMULATION_SQLITE_PATH="${{ steps.clone.outputs.local_db }}" \
          GATEWAY_DB_APPLY_SCHEMA=1 \
          SIMULATION_DB_APPLY_SCHEMA=1 \
          nohup pnpm dev > /tmp/prod-shape-stack.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:3101/health" > /dev/null; then
              echo "Stack ready after ${i} attempts."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Combined stack did not become healthy in time."
          cat /tmp/prod-shape-stack.log
          exit 1

      - name: Run prod-shape gate
        env:
          PROD_SHAPE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          PROD_SHAPE_OUTPUT_PATH: docs/load-results/prod-shape-${{ github.event.workflow_run.head_sha }}.json
          WS_URL: "ws://127.0.0.1:3101/ws"
          GATEWAY_HEALTH_URL: "http://127.0.0.1:3101/health"
          GATEWAY_METRICS_URL: "http://127.0.0.1:3101/metrics"
          SIMULATION_METRICS_URL: "http://127.0.0.1:50052/metrics"
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: pnpm ops:prod-shape:gate

      - name: Verify prod-shape gate result
        run: |
          PROD_SHAPE_GATE_RESULT_JSON="docs/load-results/prod-shape-${DEPLOY_SHA}.json" \
            pnpm ops:prod-shape:verify --target-sha "${DEPLOY_SHA}"
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      # The verifier only checks ok/sha/age, and the gate legitimately skips
      # accepted-latency checks when the probe has no valid targets. Surface what
      # was actually exercised (job summary + ::warning::) and keep the JSON.
      - name: Summarize prod-shape gate result
        if: always()
        run: |
          f="docs/load-results/prod-shape-${DEPLOY_SHA}.json"
          if [ -f "$f" ]; then
            node scripts/summarize-prod-shape-gate.mjs "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=prod-shape gate::no gate result file at $f"
          fi
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Upload prod-shape gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-shape-gate-${{ github.event.workflow_run.head_sha }}
          path: docs/load-results/prod-shape-${{ github.event.workflow_run.head_sha }}.json
          if-no-files-found: warn
          retention-days: 30

      # --- Gate passed: safe to touch real production.
      # DEPLOY_SHA (not GITHUB_SHA) deliberately: GITHUB_SHA is a reserved
      # Actions context name, and for a workflow_run-triggered job the
      # runner injects its own value for it (which for this event resolves
      # dynamically, and can end up pointing at main's live tip rather than
      # the specific run.head_sha this job was queued for) regardless of
      # any same-named `env:` override below. If two pushes to main land
      # close together, a queued run's GITHUB_SHA can silently race ahead
      # to a commit its own (shallow, single-commit) checkout never
      # fetched, so a push below would fail with "fatal: bad object <sha>"
      # -- or worse, silently deploy/tag the wrong commit to production.
      # Using a distinctly-named var sidesteps the collision entirely.
      - name: Force-push main onto production branch
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${DEPLOY_SHA}:refs/heads/production" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Tag release
        run: |
          TAG="prod-$(date -u +%Y%m%d%H%M%S)-${DEPLOY_SHA:0:7}"
          git tag "${TAG}" "${DEPLOY_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy merged sim+gateway to Hetzner (production)
        uses: ./.github/actions/hetzner-deploy
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          ssh-host: ${{ secrets.PROD_SSH_HOST }}
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          platform: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}

      - name: Write build SHA marker
        run: |
          mkdir -p packages/client/public
          echo "${DEPLOY_SHA}" > packages/client/public/__build_sha.txt
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy client to Hetzner
        run: node ./scripts/deploy-client-hetzner.mjs production
        env:
          GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          BE_CLIENT_SSH_TARGET: hetzner-target

      - name: Dump stack logs on failure
        if: failure()
        run: cat /tmp/prod-shape-stack.log || true
