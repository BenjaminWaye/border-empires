<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(64 72) scale(1.38) translate(-64 -72)">
  <!-- Variant 3: mechanical smoking rack with a simple brass-iron smoking
       kiln, rows of hanging fish, and a single brass chimney. Reads as a
       compact factory-shed: strong brass chimney + smoke puff silhouette
       so a distant player immediately tags FISH. -->
