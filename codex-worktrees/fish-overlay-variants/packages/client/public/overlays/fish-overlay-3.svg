  <path d="M34 62H94V84H34V62Z" fill="#2C2E34"/>
  <path d="M34 84H94V88H34V84Z" fill="#515B68"/>
  <!-- Kiln face door opening (darker interior) -->
  <path d="M46 68H82V84H46V68Z" fill="#1B1D21"/>
  <!-- Rows of hanging fish visible behind the open kiln face (brass hooks,
       iron-rope ties, silver-blue piscine bodies) -->
  <path d="M50 70C53 73, 53 79, 50 81C47 79, 47 73, 50 70Z" fill="#C8D2DA"/>
  <path d="M58 70C61 73, 61 79, 58 81C55 79, 55 73, 58 70Z" fill="#C8D2DA"/>
  <path d="M66 70C69 73, 69 79, 66 81C63 79, 63 73, 66 70Z" fill="#C8D2DA"/>
  <path d="M74 70C77 73, 77 79, 74 81C71 79, 71 73, 74 70Z" fill="#C8D2DA"/>
  <path d="M48 66H76" stroke="#B08D55" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 60H74" stroke="#B08D55" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 66H83" stroke="#B08D55" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 62C84 65, 90 65, 92 62V68C90 71, 84 71, 82 68V62Z" fill="#C8D2DA"/>
  <path d="M84 65H90" stroke="#515B68" stroke-width="2"/>
