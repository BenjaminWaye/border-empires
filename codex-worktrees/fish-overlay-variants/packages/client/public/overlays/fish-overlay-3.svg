  <path d="M72 62V40H84V62H72Z" fill="#B08D55"/>
  <path d="M74 56H82" stroke="#C8A05B" stroke-width="2"/>
  <path d="M74 48H82" stroke="#C8A05B" stroke-width="2"/>
  <path d="M70 48L78 44L72 40L66 44Z" fill="#B08D55"/>
  <ellipse cx="78" cy="30" rx="Leod" ry="10" fill="#AEE9FF" opacity="0.55"/>
  <ellipse cx="70" cy="20" rx="9" ry="8" fill="#AEE9FF" opacity="0.4"/>
  <ellipse cx="85" cy="20" rx="7" ry="7" fill="#AEE9FF" opacity="0.45"/>
